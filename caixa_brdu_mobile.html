<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Caixa BrDU · Mobile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#1B3A6B;--navy-u:#e8eef7;
  --yellow:#F5C518;--yellow-d:#c9a000;
  --green:#2d9e6b;--green-l:#eaf7f1;
  --red:#d63031;--red-l:#fff1f1;
  --amber:#c97a00;--amber-l:#fef5e7;
  --purple:#6c3fa0;
  --teal:#0984e3;
  --border:#e9ecef;--bg:#f4f5f8;--surface:#fff;
  --text:#1a1a2e;--text2:#555e6b;--text3:#9099a8;
  --r:10px;--r-sm:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:72px}

/* ── HEADER ── */
.header{
  background:var(--navy);
  padding:0 14px;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  border-bottom:3px solid var(--yellow);
}
.brand-m{display:flex;align-items:center;gap:8px}
.logo-img{height:32px;width:32px;border-radius:5px;background:var(--yellow);padding:2px;object-fit:contain;flex-shrink:0}
.logo-fallback{height:32px;width:32px;border-radius:5px;background:var(--yellow);display:none;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--navy);flex-shrink:0}
.brand-divider{width:1px;height:24px;background:rgba(255,255,255,.2)}
.caixa-ico-m{
  width:26px;height:26px;background:rgba(245,197,24,.15);border-radius:6px;
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(245,197,24,.25);
  flex-shrink:0;
}
.brand-txt-m{display:flex;flex-direction:column;line-height:1.1}
.brand-main{color:#fff;font-size:14px;font-weight:700}
.brand-sub{color:rgba(255,255,255,.45);font-size:9px;letter-spacing:.5px;text-transform:uppercase}
.header-date{color:rgba(255,255,255,.5);font-size:10px}

/* ── VIEW TABS ── */
.view-tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border)}
.vtab{flex:1;padding:10px 0;font-size:11px;font-weight:600;border:none;background:none;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent}
.vtab.active{color:var(--navy);border-bottom-color:var(--navy)}

/* ── MONTH / PERIOD ── */
.month-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px;background:var(--surface);border-bottom:1px solid var(--border)}
.month-bar button{background:none;border:none;color:var(--navy);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.month-lbl{font-size:13px;font-weight:600;color:var(--text)}
.period-row{display:flex;gap:6px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.pb{flex:1;padding:6px 0;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:20px;cursor:pointer;background:none;color:var(--text2)}
.pb.active{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ── SUMMARY ── */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 8px}
.sc{background:var(--surface);border-radius:var(--r);padding:12px 13px;border:1px solid var(--border)}
.sc-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.sc-val{font-size:17px;font-weight:700}
.sc-sub{font-size:10px;color:var(--text3);margin-top:2px}
.sc.wide{grid-column:1/-1}
.pb-bar{height:5px;background:var(--bg);border-radius:4px;overflow:hidden;margin:5px 0 3px}
.pb-fill{height:100%;border-radius:4px;background:var(--green)}
.pb-row{display:flex;justify-content:space-between;font-size:10px}

/* ── GRUPOS ACCORDION ── */
.sec{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px}
.sec-t{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px}
.sec-a{font-size:11px;color:var(--teal);cursor:pointer}
.grupos-wrap{padding:0 16px 4px}
.gcard{background:var(--surface);border-radius:var(--r);border:1.5px solid var(--border);margin-bottom:5px;overflow:hidden}
.gcard.ag{border-color:var(--navy)}
.gcard-head{display:flex;align-items:center;gap:9px;padding:10px 12px;cursor:pointer}
.g-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.g-name{font-size:13px;font-weight:600;flex:1;color:var(--text)}
.g-cnt{font-size:10px;color:var(--text3);background:var(--bg);border-radius:20px;padding:2px 7px}
.g-chev{font-size:11px;color:var(--text3);transition:transform .2s;margin-left:4px}
.gcard.open .g-chev{transform:rotate(180deg)}
.cascade{display:none;padding:4px 10px 10px 28px;border-top:1px solid var(--border)}
.gcard.open .cascade{display:block}
.clbl{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;padding:3px 0 4px}
.clbl.red{color:var(--red)}
.spe-row{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:var(--r-sm);cursor:pointer;margin-bottom:2px}
.spe-row:active{background:var(--bg)}
.spe-row.sel{background:var(--navy-u)}
.spb{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
.spb.ok{background:var(--navy-u);color:var(--navy)}
.spb.nok{background:var(--red-l);color:var(--red)}
.spe-n{font-size:12px;color:var(--text);flex:1}
.spe-pend{font-size:10px;font-weight:700;color:var(--red)}

/* ── SPE BANNER ── */
.spe-banner{margin:0 16px 8px;padding:9px 13px;border-radius:var(--r);background:var(--navy-u);border:1.5px solid var(--navy);display:none;align-items:center;justify-content:space-between;font-size:12px}
.spe-banner.show{display:flex}
.spe-banner strong{color:var(--navy)}
.spe-banner button{background:none;border:none;color:var(--navy);font-size:11px;font-weight:600;cursor:pointer}
.spe-banner.nok{background:var(--red-l);border-color:var(--red)}
.spe-banner.nok strong,.spe-banner.nok button{color:var(--red)}

/* ── CHIPS ── */
.cats-scroll{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.cats-scroll::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:5px 12px;border-radius:20px;border:1px solid var(--border);font-size:11px;cursor:pointer;background:var(--surface);color:var(--text2);font-weight:500}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.status-row{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 8px}
.status-row select{font-size:11px;border:1px solid var(--border);border-radius:var(--r-sm);padding:4px 8px;color:var(--text2);background:var(--surface)}

/* ── TX LIST ── */
.tx-list{padding:0 16px;display:flex;flex-direction:column;gap:6px}
.tx-item{background:var(--surface);border-radius:var(--r);padding:11px 12px;display:flex;align-items:center;gap:10px;border:1px solid var(--border)}
.tx-ico{width:33px;height:33px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.ico-out{background:#fef2f2}.ico-in{background:var(--green-l)}.ico-pend{background:var(--amber-l)}
.tx-body{flex:1;min-width:0}
.tx-nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-ds{font-size:10px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-right{text-align:right;flex-shrink:0}
.tx-v{font-size:13px;font-weight:700}
.tx-v.out{color:var(--red)}.tx-v.in{color:var(--green)}
.tx-d{font-size:10px;color:var(--text3);margin-top:2px}
.badge{display:inline-block;font-size:9px;padding:2px 7px;border-radius:20px;font-weight:600;margin-top:3px}
.badge.pago{background:var(--green-l);color:#0b6e4f}
.badge.pend{background:var(--amber-l);color:var(--amber)}
.badge.venc{background:var(--red-l);color:var(--red)}
.spe-tag{font-size:9px;background:var(--navy-u);color:var(--navy);border-radius:4px;padding:1px 5px;margin-left:3px;font-weight:600;vertical-align:middle}
.spe-tag.nok{background:var(--red-l);color:var(--red)}
.empty{padding:32px;text-align:center;color:var(--text3);font-size:12px}

/* ── SALDOS MOBILE ── */
.saldo-hero-m{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 8px}
.hero-card-m{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:11px 12px}
.hero-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.hero-val{font-size:16px;font-weight:700}
.hero-sub{font-size:10px;color:var(--text3);margin-top:2px}

.spe-saldo-list{padding:0 16px;display:flex;flex-direction:column;gap:6px}
.ssc-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:12px 14px;cursor:pointer}
.ssc-card.sel{border-color:var(--navy);border-width:2px;background:var(--navy-u)}
.ssc-card.nok{border-color:var(--red)}
.ssc-top-m{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.ssc-name-m{font-size:13px;font-weight:700;color:var(--text)}
.ssc-badge-m{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px}
.ssc-badge-m.ok{background:var(--navy-u);color:var(--navy)}
.ssc-badge-m.nok{background:var(--red-l);color:var(--red)}
.ssc-val-m{font-size:18px;font-weight:700;color:var(--navy)}
.ssc-sub-m{font-size:10px;color:var(--text3);margin-top:2px}

/* detalhe contas */
.conta-list{padding:0 16px;display:flex;flex-direction:column;gap:5px;margin-top:4px}
.conta-card{background:var(--surface);border-radius:var(--r-sm);border:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.conta-left{flex:1;min-width:0}
.conta-nome{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conta-meta{font-size:10px;color:var(--text3);margin-top:1px}
.conta-saldo{font-size:13px;font-weight:700;color:var(--navy);text-align:right;flex-shrink:0}
.real-tag{font-size:8px;font-weight:600;background:var(--green-l);color:#0b6e4f;padding:1px 4px;border-radius:3px}
.sim-tag{font-size:8px;font-weight:600;background:#fef9c3;color:#854d0e;padding:1px 4px;border-radius:3px}
.tipo-badge{font-size:9px;padding:1px 6px;border-radius:20px;font-weight:700}
.tipo-cc{background:#e8eef7;color:#1B3A6B}
.tipo-cri{background:#f3eeff;color:#6c3fa0}
.tipo-esc{background:var(--amber-l);color:var(--amber)}
.tipo-inv{background:var(--green-l);color:#0b6e4f}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:430px;background:var(--surface);border-top:2px solid var(--yellow);display:flex;padding:6px 0 env(safe-area-inset-bottom,12px)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--text3);cursor:pointer;border:none;background:none;padding:4px}
.nav-btn.active{color:var(--navy)}
.nav-ico{font-size:20px}

/* ── SCREENS ── */
.screen{display:none}
.screen.show{display:block}
</style>
</head>
<body>

<!-- VIEW TABS -->
<div class="view-tabs">

<!-- MONTH + PERIOD -->

<!-- ═══ TELA CAIXA ═══ -->
<div class="screen show" id="screen-caixa">

  <div id="spe-banner" class="spe-banner"></div>

  <div class="sec"><span class="sec-t">Categoria</span></div>

  <div class="status-row">

      <option value="todos">Todos</option>
      <option value="pago">Pago</option>
      <option value="pend">A pagar</option>
      <option value="venc">Vencido</option>
    </select>
  </div>
  <div class="tx-list" id="tx-list"></div>
</div>

<!-- ═══ TELA SALDOS ═══ -->
<div class="screen" id="screen-saldos">
  <div class="saldo-hero-m" id="saldo-hero"></div>

  <div class="sec">
    <span class="sec-t">SPE / Grupos</span>
    <select id="tipo-filter-m" onchange="renderSaldosMobile()" style="font-size:10px;border:1px solid var(--border);border-radius:6px;padding:3px 7px;color:var(--text2);background:var(--surface)">
      <option value="todos">Todos os tipos</option>
      <option value="Conta Corrente">C/C</option>
      <option value="CRI">CRI</option>
      <option value="Escrow">Escrow</option>
    </select>
  </div>
  <div class="spe-saldo-list" id="spe-saldo-list"></div>

  <div id="conta-section" style="display:none">
    <div class="sec" style="margin-top:10px">
      <span class="sec-t" id="conta-sec-title">Contas</span>
      <span class="sec-a" onclick="closeConta()">✕ Fechar</span>
    </div>
    <div class="conta-list" id="conta-list"></div>
  </div>

  <div style="padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap">
    <span style="font-size:10px;color:var(--text3)">ℹ Saldos simulados.</span>
    <span style="font-size:10px"><span class="real-tag">REAL</span> da planilha · <span class="sim-tag">SIM</span> aguarda integração</span>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-btn active"><div class="nav-ico">🏠</div>Início</button>
  <button class="nav-btn"><div class="nav-ico">📊</div>Relatório</button>
  <button class="nav-btn"><div class="nav-ico">🏦</div>Contas</button>
  <button class="nav-btn"><div class="nav-ico">⚙️</div>Config</button>
</div>

function setCat(c){activeCat=c;renderCaixa();}
function toggleCard(id){const c=document.getElementById('gc-'+id);if(c)c.classList.toggle('open');}
function setSPESaldo(id){activeSPESaldo=activeSPESaldo===id?null:id;renderContaDetail();}
function closeConta(){activeSPESaldo=null;document.getElementById('conta-section').style.display='none';}

function setView(v,btn){
  activeView=v;
  document.querySelectorAll('.vtab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('screen-caixa').classList.toggle('show',v==='caixa');
  document.getElementById('screen-saldos').classList.toggle('show',v==='saldos');
  if(v==='saldos') renderSaldosMobile();
}

function filtered(){
  let tx=[...TX];
  if(activeGrupo!=='todos') tx=tx.filter(t=>t.g===activeGrupo);
  if(activeSPE){const g=SPE_GROUPS.find(x=>x.id===activeSPE);if(g)tx=tx.filter(t=>g.uaus.includes(t.u));}
  if(activeCat!=='todos') tx=tx.filter(t=>t.c===activeCat);
  const st=document.getElementById('st-sel').value;
  if(st!=='todos') tx=tx.filter(t=>t.s===st);
  return tx;
}

function renderSummary(){
  const tx=filtered();
  const saidas=tx.filter(t=>t.t==='out').reduce((a,b)=>a+Math.abs(b.v),0);
  const entradas=tx.filter(t=>t.t==='in').reduce((a,b)=>a+b.v,0);
  const pagos=tx.filter(t=>t.s==='pago'&&t.t==='out').reduce((a,b)=>a+Math.abs(b.v),0);
  const apagar=tx.filter(t=>t.s!=='pago'&&t.t==='out').reduce((a,b)=>a+Math.abs(b.v),0);
  const saldo=entradas-saidas;
  const pct=saidas>0?Math.round(pagos/saidas*100):0;
  document.getElementById('sum-grid').innerHTML=`
    <div class="sc"><div class="sc-lbl">Entradas</div><div class="sc-val" style="color:#2d9e6b">${fmtR(entradas)}</div><div class="sc-sub">${tx.filter(t=>t.t==='in').length} lançam.</div></div>
    <div class="sc"><div class="sc-lbl">Saídas</div><div class="sc-val" style="color:#d63031">${fmtR(saidas)}</div><div class="sc-sub">${tx.filter(t=>t.t==='out').length} lançam.</div></div>
    <div class="sc"><div class="sc-lbl">A pagar</div><div class="sc-val" style="color:#c97a00">${fmtR(apagar)}</div><div class="sc-sub">${tx.filter(t=>t.s!=='pago'&&t.t==='out').length} pendentes</div></div>
    <div class="sc"><div class="sc-lbl">Saldo</div><div class="sc-val" style="color:#1B3A6B">${fmtR(Math.abs(saldo))} ${saldo>=0?'▲':'▼'}</div><div class="sc-sub">${saldo>=0?'Positivo':'Negativo'}</div></div>
    <div class="sc wide"><div class="sc-lbl">Execução de pagamentos</div>
      <div class="pb-bar"><div class="pb-fill" style="width:${pct}%"></div></div>
      <div class="pb-row"><span style="color:#2d9e6b">✓ ${fmtR(pagos)}</span><span style="font-weight:700">${pct}%</span><span style="color:#c97a00">⏳ ${fmtR(apagar)}</span></div>
    </div>`;
}

function renderGrupos(){
  let html='';
  GRUPOS_P.forEach(gp=>{
    const spes=SPE_GROUPS.filter(s=>gp.id!=='todos'&&s.g===gp.id);
    const gtx=TX.filter(t=>gp.id==='todos'||t.g===gp.id);
    const pend=gtx.filter(t=>t.s!=='pago'&&t.t==='out').length;
    const isAct=activeGrupo===gp.id;
    html+=`<div class="gcard${isAct?' ag':''}" id="gc-${gp.id}">
      <div class="gcard-head" onclick="setGrupo('${gp.id}')">
        <div class="g-dot" style="background:${gp.color}"></div>
        <span class="g-name">${gp.label}</span>
        <span class="g-cnt">${gtx.length}</span>
        ${pend?`<span style="font-size:9px;font-weight:700;color:#d63031;margin-left:2px">${pend}⚠</span>`:''}
        ${spes.length?`<span class="g-chev" onclick="event.stopPropagation();toggleCard('${gp.id}')">▼</span>`:''}
      </div>`;
    if(spes.length){
      html+=`<div class="cascade">`;
      spes.filter(s=>s.s==='confirmed').forEach(s=>{
        const sp=TX.filter(t=>s.uaus.includes(t.u)&&t.s!=='pago'&&t.t==='out').length;
        html+=`<div class="spe-row${activeSPE===s.id?' sel':''}" onclick="setSPE('${s.id}')">
          <span class="spb ok">${s.d}</span><span class="spe-n">${s.label}</span>
          ${sp?`<span class="spe-pend">${sp}⚠</span>`:''}
        </div>`;
      });
      const vals=spes.filter(s=>s.s==='validate');
      if(vals.length){
        html+=`<div class="clbl red">⚠ Validar grupos</div>`;
        vals.forEach(s=>{
          html+=`<div class="spe-row${activeSPE===s.id?' sel':''}" onclick="setSPE('${s.id}')">
            <span class="spb nok">⚠</span><span class="spe-n">${s.label}</span>
          </div>`;
        });
      }
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  document.getElementById('grupos-wrap').innerHTML=html;
  if(activeGrupo!=='todos'){const c=document.getElementById('gc-'+activeGrupo);if(c)c.classList.add('open');}
}

function renderBanner(){
  const el=document.getElementById('spe-banner');
  if(!activeSPE){el.className='spe-banner';return;}
  const g=SPE_GROUPS.find(x=>x.id===activeSPE);
  if(!g){el.className='spe-banner';return;}
  el.className='spe-banner show'+(g.s==='validate'?' nok':'');
  el.innerHTML=`<span><strong>${g.label}</strong> · ${g.d}</span><button onclick="clearAll()">✕</button>`;
}

function renderCats(){
  document.getElementById('cat-chips').innerHTML=CATS.map(c=>`
    <span class="chip${activeCat===(c==='Todos'?'todos':c)?'  active':''}" onclick="setCat('${c==='Todos'?'todos':c}')">${c}</span>`).join('');
}

function getSPETag(u){
  if(activeSPE) return'';
  const g=SPE_GROUPS.find(x=>x.uaus.includes(u)&&x.s==='confirmed');
  const gv=SPE_GROUPS.find(x=>x.uaus.includes(u)&&x.s==='validate');
  if(g) return`<span class="spe-tag">${g.label}</span>`;
  if(gv) return`<span class="spe-tag nok">⚠ ${gv.label}</span>`;
  return'';
}

function renderTxList(){
  const tx=filtered().sort((a,b)=>a.dia-b.dia);
  const iM={CRI:'🏗',Empréstimo:'🏦',Imposto:'📋',Tarifa:'🏧',Aporte:'📤',Distribuição:'🎯',Operacional:'🔄'};
  const el=document.getElementById('tx-list');
  if(!tx.length){el.innerHTML='<div class="empty">Nenhum lançamento.</div>';return;}
  el.innerHTML=tx.map(t=>{
    const ico=t.t==='in'?'💰':(iM[t.c]||'🔄');
    const bg=t.t==='in'?'ico-in':t.s==='pend'?'ico-pend':'ico-out';
    const bdg=t.s==='pago'?'pago':t.s==='venc'?'venc':'pend';
    return`<div class="tx-item">
      <div class="tx-ico ${bg}">${ico}</div>
      <div class="tx-body">
        <div class="tx-nm">${t.n}${getSPETag(t.u)}</div>
        <div class="tx-ds">${t.d} · UAU ${t.u}</div>
        <span class="badge ${bdg}">${t.s==='pago'?'Pago':t.s==='venc'?'Vencido':'A pagar'}</span>
      </div>
      <div class="tx-right">
        <div class="tx-v ${t.t==='out'?'out':'in'}">${t.t==='out'?'- ':'+ '}${fmtR(t.v)}</div>
        <div class="tx-d">dia ${t.dia}/${(curMonth+1).toString().padStart(2,'0')}</div>
      </div>
    </div>`;
  }).join('');
}

function renderCaixa(){renderBanner();renderSummary();renderCats();renderTxList();}

// ── SALDOS MOBILE
function renderSaldosMobile(){
  const cs=CONTAS.filter(c=>activeGrupo==='todos'||c.grupo===activeGrupo);
  const total=cs.reduce((a,b)=>a+b.saldo,0);
  const byTipo={};cs.forEach(c=>{byTipo[c.tipo]=(byTipo[c.tipo]||0)+c.saldo;});
  document.getElementById('saldo-hero').innerHTML=`
    <div class="hero-card-m"><div class="hero-lbl">Saldo Total</div><div class="hero-val" style="color:#1B3A6B">${fmtR(total)}</div><div class="hero-sub">${cs.length} contas</div></div>
    <div class="hero-card-m"><div class="hero-lbl">C/C</div><div class="hero-val" style="color:#2d9e6b">${fmtR(byTipo['Conta Corrente']||0)}</div><div class="hero-sub">${cs.filter(c=>c.tipo==='Conta Corrente').length} contas</div></div>
    <div class="hero-card-m"><div class="hero-lbl">CRI</div><div class="hero-val" style="color:#6c3fa0">${fmtR(byTipo['CRI']||0)}</div><div class="hero-sub">${cs.filter(c=>c.tipo==='CRI').length} contas</div></div>
    <div class="hero-card-m"><div class="hero-lbl">Escrow/Inv.</div><div class="hero-val" style="color:#c97a00">${fmtR((byTipo['Escrow']||0)+(byTipo['Conta Investimento']||0))}</div><div class="hero-sub">${cs.filter(c=>c.tipo==='Escrow'||c.tipo==='Conta Investimento').length} contas</div></div>`;

  const spes=SPE_GROUPS.filter(g=>activeGrupo==='todos'||g.g===activeGrupo);
  const tf=document.getElementById('tipo-filter-m').value;
  let html='';
  spes.forEach(g=>{
    let gcs=CONTAS.filter(c=>g.uaus.includes(c.uau));
    if(tf!=='todos') gcs=gcs.filter(c=>c.tipo===tf);
    if(!gcs.length) return;
    const tot=gcs.reduce((a,b)=>a+b.saldo,0);
    const isSel=activeSPESaldo===g.id;
    html+=`<div class="ssc-card${isSel?' sel':''}${g.s==='validate'?' nok':''}" onclick="setSPESaldo('${g.id}')">
      <div class="ssc-top-m">
        <span class="ssc-name-m">${g.label}</span>
        <span class="ssc-badge-m ${g.s==='validate'?'nok':'ok'}">${g.s==='validate'?'⚠ validar':g.d}</span>
      </div>
      <div class="ssc-val-m">${fmtR(tot)}</div>
      <div class="ssc-sub-m">${gcs.length} contas · UAU ${g.uaus.slice(0,3).join(',')}${g.uaus.length>3?'…':''}</div>
    </div>`;
  });
  document.getElementById('spe-saldo-list').innerHTML=html||'<div class="empty">Nenhum SPE com contas.</div>';
  renderContaDetail();
}

function renderContaDetail(){
  const sec=document.getElementById('conta-section');
  if(!activeSPESaldo){sec.style.display='none';return;}
  const g=SPE_GROUPS.find(x=>x.id===activeSPESaldo);
  if(!g){sec.style.display='none';return;}
  sec.style.display='block';
  const tf=document.getElementById('tipo-filter-m').value;
  let cs=CONTAS.filter(c=>g.uaus.includes(c.uau));
  if(tf!=='todos') cs=cs.filter(c=>c.tipo===tf);
  document.getElementById('conta-sec-title').textContent=g.label+' — '+fmtR(cs.reduce((a,b)=>a+b.saldo,0));
  const tCls={'Conta Corrente':'tipo-cc',CRI:'tipo-cri',Escrow:'tipo-esc','Conta Investimento':'tipo-inv'};
  document.getElementById('conta-list').innerHTML=cs.map(c=>`
    <div class="conta-card">
      <div class="conta-left">
        <div class="conta-nome">${c.razao.length>35?c.razao.slice(0,33)+'…':c.razao}</div>
        <div class="conta-meta">🏦 ${c.banco} · Ag ${c.ag} · C/C ${c.cc} <span class="tipo-badge ${tCls[c.tipo]||'tipo-cc'}">${c.tipo}</span></div>
      </div>
      <div style="text-align:right">
        <div class="conta-saldo">${fmtR(c.saldo)}</div>
        <div><span class="${c.saldo_real?'real-tag':'sim-tag'}">${c.saldo_real?'REAL':'SIM'}</span></div>
      </div>
    </div>`).join('');
}

function renderAll(){renderGrupos();renderCaixa();}

document.getElementById('today-lbl').textContent=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
renderAll();
</script>
